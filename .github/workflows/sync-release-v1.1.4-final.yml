name: Sync final v1.1.4 Release Asset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified package from Gitee
        shell: bash
        run: |
          curl -fL --retry 8 --retry-all-errors --output BET-DragonScience.exe "https://gitee.com/dragonMalong/unified-bet-analysis/releases/download/v1.1.4/BET-DragonScience.exe"
          echo "80c6f6d4be0da86ceb96ae55e3150e8e61ad406c49ea5b85645a818c0d3b8dd4  BET-DragonScience.exe" | sha256sum --check --strict
          echo "80c6f6d4be0da86ceb96ae55e3150e8e61ad406c49ea5b85645a818c0d3b8dd4  BET-DragonScience.exe" > SHA256SUMS.txt
      - name: Replace GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1.4 BET-DragonScience.exe SHA256SUMS.txt --clobber --repo dragonMaLong/unified-bet-analysis
