name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --noconfirm BET.spec

      - name: Write SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 "dist/Micromeritics-BET.exe").Hash.ToLower()
          "$hash  Micromeritics-BET.exe" | Set-Content -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$env:TAG_NAME" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:TAG_NAME" --title "$env:TAG_NAME" --notes "Windows executable build for $env:TAG_NAME."
          }
          gh release upload "$env:TAG_NAME" "dist/Micromeritics-BET.exe" "dist/SHA256SUMS.txt" --clobber
