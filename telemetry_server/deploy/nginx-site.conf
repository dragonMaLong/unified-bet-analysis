# Include once from nginx.conf's http {} block (e.g. sites-enabled).
# nginx-http.conf must also be included at http {} level.
server {
    listen 80;
    listen [::]:80;
    server_name stats.dragonscience.top;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bet-telemetry-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://stats.dragonscience.top$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stats.dragonscience.top;
    ssl_certificate /etc/letsencrypt/live/stats.dragonscience.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stats.dragonscience.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BETTelemetrySSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Request/error logs can contain IPs. Keep both off for this dedicated site.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 10s;
    limit_req_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host stats.dragonscience.top;
    # REPLACE the incoming header: do NOT use $proxy_add_x_forwarded_for.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_request_buffering on;
    proxy_buffering on;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location = /api/v1/events {
        limit_except POST { deny all; }
        limit_req zone=bet_telemetry_event_ip burst=20 nodelay;
        limit_req zone=bet_telemetry_site burst=50 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /admin {
        limit_except GET { deny all; }
        limit_req zone=bet_telemetry_admin_ip burst=5 nodelay;
        limit_req zone=bet_telemetry_site burst=50 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /admin/summary {
        limit_except GET { deny all; }
        limit_req zone=bet_telemetry_admin_ip burst=5 nodelay;
        limit_req zone=bet_telemetry_site burst=50 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
    location = /healthz {
        limit_except GET { deny all; }
        limit_req zone=bet_telemetry_event_ip burst=5 nodelay;
        limit_req zone=bet_telemetry_site burst=50 nodelay;
        proxy_pass http://127.0.0.1:8765;
    }
    location / { return 404; }
}
