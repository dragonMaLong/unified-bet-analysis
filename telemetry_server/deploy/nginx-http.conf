# Include once from nginx.conf's http {} block, not inside a server/location.
limit_req_zone $binary_remote_addr zone=bet_telemetry_event_ip:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bet_telemetry_admin_ip:1m rate=1r/s;
limit_req_zone $server_name zone=bet_telemetry_site:1m rate=10r/s;
