# Temporary HTTP-only site for initial ACME certificate issuance.
# Replace this file with nginx-site.conf AFTER the certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name stats.dragonscience.top;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 64k;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/bet-telemetry-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
